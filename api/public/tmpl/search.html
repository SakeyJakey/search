{{ define "search.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ .Query }} - Search</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body class="search-page">
	<div class="header">
		<div class="header-content">
			<a href="/" class="logo-small">Seek</a>
			<form method="get" action="/search" class="search-form-header">
				<div class="search-input-wrapper-header">
					<input
						type="text"
						name="q"
						class="search-input-header"
						placeholder="Search..."
						value="{{ .Query }}"
						autocomplete="off"
					>
					<button type="submit" class="search-button-header" aria-label="Search">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<circle cx="11" cy="11" r="8"></circle>
							<path d="m21 21-4.35-4.35"></path>
						</svg>
					</button>
				</div>
			</form>
		</div>
	</div>

	<div class="results-container">
		<div class="results-meta">
			<p>About <strong>{{ .Count }}</strong> results</p>
		</div>

		{{ if .Results }}
			{{ range .Results }}
				{{ template "search-result" . }}
			{{ end }}
		{{ else }}
			<div class="no-results">
				<h2>No results found</h2>
				<p>Try different keywords or check your spelling</p>
			</div>
		{{ end }}
	</div>
</body>
</html>
{{ end }}
