kind = "web"
previewPath = "/"
title = "Search Engine"
version = "1.0.0"
id = "artifacts/search-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20237

[services.development]
run = "pnpm --filter @workspace/search-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/search-ui", "run", "build" ]
publicDir = "artifacts/search-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20237"
BASE_PATH = "/"
